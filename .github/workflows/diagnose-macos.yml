name: diagnose-macos

# Temporary: find out which tests fail or hang on a macOS runner, and at which point.
# Deleted once the question is answered.
on:
  push:
    branches: [ci/tests]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verbose:
    name: verbose (macos-latest, 3.10)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run the suite verbosely, module by module
        run: |
          set -x
          for m in test_package_content test_chain test_ledger test_preflight test_health test_acceptance test_closeout test_progress_dashboard test_inbox_loop test_ci_config; do
            echo "::group::$m"
            start=$(date +%s)
            python -m unittest "tests.$m" -v || echo "MODULE FAILED: $m"
            echo "::endgroup::"
            echo "$m took $(( $(date +%s) - start ))s"
          done
