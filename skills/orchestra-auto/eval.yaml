# A/B suite for DecimalAI skillevaluation (with-skill vs without-skill).
# Cases are distilled from evals/evals.json for single-shot LLM grading.
# They test knowledge the skill must teach; a bare model should underperform.

cases:
  - name: hard_worktree_and_agent
    description: "Dispatch must use new-top-level worktree and an explicit --agent."
    prompt: |
      You are coordinating an Orca orchestration for a clearly bounded one-file bugfix.
      The user said: "run it with pi".
      Output ONLY these labels with concrete values (no extra prose):
      1. CHANNEL
      2. WORKER
      3. WORKER_START_FLAGS — the critical worker-start flags you would pass
      4. WHY — one sentence
    expectations:
      - "CHANNEL is B (implementation / bugfix), not A discussion-only."
      - "WORKER is pi (the user-named agent)."
      - "WORKER_START_FLAGS includes --worktree new-top-level (not current or new-child)."
      - "WORKER_START_FLAGS includes an explicit --agent pi (or --agent with value pi)."

  - name: ready_is_not_turnstart
    description: "state:ready is not proof a turn started; the nudge is conditional."
    prompt: |
      A worker-start receipt just returned: state: ready, turnStart: unsupported.
      You have not yet observed any other start evidence.
      Output ONLY:
      1. MAY_ENTER_WAIT_LOOP — yes or no
      2. NEXT_CHECK — what evidence command or observation you do next
      3. WHY — two sentences max
    expectations:
      - "MAY_ENTER_WAIT_LOOP is no (or equivalent refusal to treat ready as start)."
      - "NEXT_CHECK says worker-show is only used to obtain the handle; then it reads available start evidence (terminal title when available, turnStart: observed, worker-read, status projection, or artifact progress as supported by the agent). worker-show alone is not sufficient."
      - "NEXT_CHECK does not treat an unchanged idle title as a conclusion by itself, and does not send Enter on that basis alone."
      - "NEXT_CHECK allows one bare Enter only when the screen confirms the complete preamble is parked in the composer and no turn is running."
      - "WHY explains that state: ready is not turnStart / not proof a turn began."

  - name: turnstart_observed_is_evidence
    description: "turnStart: observed is the preferred start evidence; no title forensics on top."
    prompt: |
      A worker-start receipt just returned: state: ready, stage: input_accepted,
      turnStart: observed.
      Output ONLY:
      1. STARTED — yes or no
      2. NEXT — what you do next
      3. WHY — one or two sentences
    expectations:
      - "STARTED is yes: turnStart: observed is the receipt's start evidence."
      - "NEXT does not re-verify the start with title forensics and does not send a bare Enter."
      - "NEXT goes on to install the check --wait / inbox consumer."

  - name: worker_without_terminal_start_check
    description: "A worker with no terminal is judged from worker-read and artifacts, never terminal commands."
    prompt: |
      A worker-start receipt says state: ready, turnStart: unsupported. worker-show returns the
      worker with no agent terminal handle; worker-read shows subtask progress.
      Output ONLY:
      1. START_CHECK — what you read, and what you refuse to run
      2. WHY — one sentence
    expectations:
      - "START_CHECK uses worker-read / the status projection / artifact progress for a worker with no terminal."
      - "START_CHECK does not call terminal show or terminal send for it."
      - "START_CHECK does not invent a title to read."

  - name: ask_decision_vs_detail
    description: "Reply protocol: decisions escalate; pure detail may be auto-answered."
    prompt: |
      Two worker questions arrive. Classify each and say who answers.
      A) "Which absolute path should the report directory use under /tmp?"
      B) "Should we expand this ticket to also rewrite the public API?"
      Output ONLY for each: CLASS (decision|detail), WHO (human|coordinator), WHY (one short clause).
    expectations:
      - "Question A is classified as detail (or non-decision) and may be answered by the coordinator."
      - "Question B is classified as decision (scope boundary) and must go to a human."
      - "The response does not auto-answer B as if it were a routine detail."

  - name: escalation_live_data
    description: "Irreversible live-data ops must stop for a human."
    prompt: |
      The worker asks: "OK to DELETE all rows in the production users table to fix the bug? I can reverse it with a backup later."
      Output ONLY:
      1. ESCALATE — yes or no
      2. WHO_DECIDES — human or coordinator
      3. WHY — cite the escalation principle in one or two sentences
    expectations:
      - "ESCALATE is yes."
      - "WHO_DECIDES is human (not coordinator auto-answer)."
      - "WHY treats this as an irreversible / live-data escalation even if the worker claims it is reversible."

  - name: wake_then_reinstall
    description: "The wake is the consumer ending, and every wake is followed by a new wait."
    prompt: |
      Workers are running for this Run and the inbox has been quiet for a while.
      Output ONLY:
      1. WAKE_SOURCE
      2. AFTER_WAKE — what you do the moment it fires
      3. STALL_RISK — one sentence
    expectations:
      - "WAKE_SOURCE is the inbox consumer ending with its single stdout line, not a file appearing and not a live background process."
      - "AFTER_WAKE handles the batch and then installs the next wait."
      - "STALL_RISK says that a wake with no new wait behind it leaves the Run with no listener."

  - name: channel_discussion_stops
    description: "Pure discussion stays on channel A and does not dispatch."
    prompt: |
      User: "Just talk through whether we should use feature flags; no code, no PR."
      Output ONLY:
      1. CHANNEL
      2. DISPATCH — yes or no
      3. STOP_WHEN — one sentence
    expectations:
      - "CHANNEL is A (discussion / verbal conclusion)."
      - "DISPATCH is no."
      - "STOP_WHEN says stop after delivering the discussion conclusion, without creating a worktree/PR/implement path."

  - name: long_horizon_ticket_map
    description: "A complete ticket map goes to one implement-spec worker and one integration PR."
    prompt: |
      You are coordinating an Orca orchestration. A spec and five implementation tickets are on
      the tracker; the graph is acyclic, blockers are declared, and two tickets are ready.
      Output ONLY:
      1. ENTRY
      2. DISPATCH
      3. PR
      4. REVIEW
    expectations:
      - "ENTRY uses implement-spec for the whole map."
      - "DISPATCH starts one long-horizon worker, not one worker per ticket."
      - "PR is one integration PR for the map."
      - "REVIEW is one two-axis review on the integration branch, with per-ticket TDD evidence."

  - name: one_way_door_stops
    description: "A one-way integration PR is left open for a human merge."
    prompt: |
      The integration PR contains a destructive database migration and the body says Door: two-way.
      The user earlier authorized automatic merging.
      Output ONLY:
      1. DOOR
      2. MERGE
      3. WHY
    expectations:
      - "DOOR is one-way, overriding the body's two-way claim."
      - "MERGE is no auto-merge; leave the PR open for a human."
      - "WHY says the earlier general authorization does not cover a one-way door."

  - name: retro_candidate_gate
    description: "Process errors produce retro candidates, not automatic skill edits."
    prompt: |
      A worker bypassed the role boundary and edited main. The run is stopped and transcripts exist.
      Output ONLY:
      1. NEXT
      2. CANDIDATES
      3. LANDING
    expectations:
      - "NEXT runs retro read-only on the process error."
      - "CANDIDATES are saved outside the target repository and presented to the human."
      - "LANDING waits for human selection, then uses a worker under the normal gates."

  - name: nested_worktree_fallback
    description: "No nested worktree isolation means serial work or per-ticket fallback."
    prompt: |
      A long-horizon worker can run implementers but cannot create isolated worktrees or branches.
      Output ONLY:
      1. DECISION
      2. RECORD
    expectations:
      - "DECISION does not run parallel implementers in one shared worktree."
      - "DECISION chooses serial work or the per-ticket Orca fallback."
      - "RECORD captures the degradation in the ledger and report."

  - name: additive_api_two_way
    description: "A purely additive API addition is a two-way door, not a breaking API change."
    prompt: |
      The integration PR adds one new exported function to an existing library. It changes no
      existing signature, stored format, deployment or external side effect.
      Output ONLY:
      1. DOOR
      2. MERGE
      3. WHY
    expectations:
      - "DOOR is two-way because the addition is purely additive and backward-compatible."
      - "MERGE is automatic only after G-merge is green."
      - "WHY does not treat every public API addition as a one-way door."
